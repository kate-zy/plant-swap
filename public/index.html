<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fancy frond friends!</title>
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#3d4630">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plant Swap">
</head>
<body>
  <header class="site-header">
    <h1 id="site-title">🌿 Plant Swap</h1>
    <p>Free cuttings, plants, and green stuff from my collection!</p>
  </header>

  <main>
    <div class="toolbar">
      <div class="filters" id="filters">
        <button data-filter="available" class="active">Available</button>
        <button data-filter="all">All</button>
      </div>
      <div class="toolbar-right">
        <div class="filters" id="view-toggle">
          <button data-view="grid" class="active">Grid</button>
          <button data-view="list">List</button>
        </div>
        <a href="/admin.html" class="btn btn-outline" style="text-decoration:none;">Admin</a>
      </div>
    </div>

    <div class="filters" id="form-filters">
      <button data-form="all" class="active">All forms</button>
      <button data-form="fresh_prop">Fresh prop</button>
      <button data-form="bare_root">Bare root</button>
      <button data-form="in_soil">In soil</button>
    </div>

    <div id="grid" class="grid"></div>
    <div id="empty" class="empty-state" style="display:none;">Nothing listed right now — check back soon 🌱</div>
  </main>

  <footer class="site-footer">Built with Plant Swap</footer>

  <div id="claim-modal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <h2>Claim this plant</h2>
      <p id="claim-plant-name" style="color:var(--ink-soft); margin-top:-8px;"></p>
      <form id="claim-form" novalidate>
        <div class="field">
          <label for="claim-name">Your name</label>
          <input type="text" id="claim-name" required>
          <div class="field-error" id="err-claim-name"></div>
        </div>
        <div class="field">
          <label for="claim-contact">How will you grab it?</label>
          <select id="claim-contact" required>
            <option value="" disabled selected>Choose one...</option>
            <option value="Next time I see you">Next time I see you</option>
            <option value="I'll swing by and pick it up!">I'll swing by and pick it up!</option>
            <option value="other">Other...</option>
          </select>
          <input type="text" id="claim-contact-other" placeholder="Tell us how/when, or how to reach you" style="display:none; margin-top:8px;">
          <div class="field-error" id="err-claim-contact"></div>
        </div>
        <div class="field" id="claim-qty-field">
          <label for="claim-qty">How many would you like?</label>
          <input type="number" id="claim-qty" min="1" value="1" required>
          <div class="field-error" id="err-claim-qty"></div>
        </div>
        <div class="field">
          <label for="claim-message">Message (optional)</label>
          <textarea id="claim-message" placeholder="e.g. I can pick up this weekend!"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-outline" id="claim-cancel">Cancel</button>
          <button type="submit" class="btn-primary">Send claim request</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" style="display:none;"></div>

  <script src="/app.js"></script>
</body>
</html>
